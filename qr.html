<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - 掃碼點餐</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Serif TC', serif;
            background: #f5f0e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(107, 68, 35, 0.15);
            border: 2px solid #e8dcc8;
            max-width: 420px;
            width: 100%;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 3px solid #d4a574;
        }

        .restaurant-name {
            font-size: 26px;
            font-weight: 900;
            color: #6B4423;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: #8B6F47;
            margin-bottom: 32px;
            letter-spacing: 1px;
        }

        .qr-wrapper {
            background: white;
            border: 3px solid #6B4423;
            border-radius: 16px;
            padding: 20px;
            display: inline-block;
            margin-bottom: 28px;
        }

        .qr-wrapper img {
            display: block;
            width: 220px;
            height: 220px;
        }

        .scan-text {
            font-size: 22px;
            font-weight: 700;
            color: #2d5016;
            margin-bottom: 8px;
        }

        .scan-sub {
            font-size: 14px;
            color: #78716c;
            margin-bottom: 32px;
        }

        .divider {
            border: none;
            border-top: 1px dashed #d4a574;
            margin: 28px 0;
        }

        .url-text {
            font-size: 12px;
            color: #a8a29e;
            word-break: break-all;
        }

        .print-btn {
            margin-top: 32px;
            padding: 12px 32px;
            background: #6B4423;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Noto Serif TC', serif;
            cursor: pointer;
            font-weight: 600;
        }

        .print-btn:hover {
            background: #8B6F47;
        }

        @media print {
            body { background: white; }
            .print-btn { display: none; }
            .card { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>
    <div class="card">
        <img
            src="https://raw.githubusercontent.com/chenpeter1312/pos-system/main/logo.jpeg"
            alt="Logo"
            class="logo"
            onerror="this.style.display='none'"
        />
        <div class="restaurant-name">Lee's Taiwanese</div>
        <div class="subtitle">Comfort Food</div>

        <div class="qr-wrapper">
            <img id="qr-img" alt="QR Code" />
        </div>

        <div class="scan-text">掃碼點餐</div>
        <div class="scan-sub">Scan to Order</div>

        <hr class="divider" />
        <div class="url-text" id="url-display"></div>

        <button class="print-btn" onclick="window.print()">🖨️ 列印</button>
    </div>

    <script>
        const url = 'https://lee-taiwanese-comfort-food.vercel.app';
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=10&data=${encodeURIComponent(url)}`;
        document.getElementById('qr-img').src = qrUrl;
        document.getElementById('url-display').textContent = url;
    </script>
</body>
</html>
